name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project PowerControl.xcodeproj \
            -scheme PowerControl \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 ipa
        run: |
          APP=$(find build -name "PowerControl.app" -type d | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r PowerControl-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PowerControl-unsigned
          path: PowerControl-unsigned.ipa
